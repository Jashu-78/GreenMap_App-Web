<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenMap AI — Offline</title>
<style>
  html,body{height:100%;margin:0;}
  body{background:#0B3B24;color:#e8f3ec;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;}
  img{width:120px;height:120px;border-radius:24px;margin-bottom:18px;}
  h1{font-size:20px;margin:0 0 8px;}
  p{font-size:14px;color:rgba(232,243,236,.75);margin:0 0 20px;line-height:1.45;}
  button{background:#f2da44;color:#06431f;border:none;border-radius:22px;padding:11px 26px;font-size:14px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
  <div>
    <img src="icon-192.png" alt="GreenMap AI">
    <h1>You're offline</h1>
    <p>GreenMap AI needs the internet for live data.<br>Check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
