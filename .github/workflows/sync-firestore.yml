name: Sync data to Firestore

# Runs whenever the product list or scheme list changes on GitHub,
# and can also be started by hand (Actions tab -> Run workflow).
on:
  push:
    branches: [main]
    paths:
      - "Smart_Energy_Search.html"
      - "Govt_Schemes.html"
      - "scripts/sync-firestore.js"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo files
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install firebase-admin
        run: npm install firebase-admin@12 --no-save

      - name: Write PRODUCTS and SCHEMES to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: node scripts/sync-firestore.js
